version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Security updates bypass cooldown and the version-update schedule.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
  # Workflows use major tags, so routine updates are major upgrades that wait for cooldown.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Security updates bypass cooldown and the version-update schedule.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - '*'
