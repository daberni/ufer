name: Release

# Pushing a version tag (for example 0.4.0) on a commit of main releases that commit to production:
# verify → plan (pending changeset names in the summary, read-only token) → deploy without the domain →
# migrate (only when changesets are pending; gated by the production-migration environment, which alone holds the write token:
# backup → re-check → rehearsal on a local copy including an app run → migrate) → promote → smoke test.
# Approving the production-migration environment is the explicit authorization for exactly the changesets listed in this run's summary.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check tag, version and history
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG does not point to a commit on main."
            exit 1
          fi
          # Runs in the concurrency group may start in any order; only the highest version may release, so an older tag
          # never promotes over a newer one. Roll back with Vercel's instant rollback instead (docs/releasing.md#recovery).
          git fetch --force --tags origin > /dev/null
          highest=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          if [ "$TAG" != "$highest" ]; then
            echo "::error::Tag $TAG is not the highest version ($highest); an older tag cannot be released."
            exit 1
          fi

      # Without a protection rule the gate job would run without asking; fail closed instead of migrating unapproved.
      - name: Check that the migration gate requires a reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! rules=$(gh api "repos/$GITHUB_REPOSITORY/environments/production-migration" --jq '[.protection_rules[]?.type]'); then
            echo "::error::The production-migration environment does not exist. See docs/releasing.md#one-time-setup."
            exit 1
          fi
          if ! jq -e 'index("required_reviewers") != null' <<< "$rules" > /dev/null; then
            echo "::error::The production-migration environment has no required reviewers. See docs/releasing.md#one-time-setup."
            exit 1
          fi

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run check:styles
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  plan:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
      changesets: ${{ steps.plan.outputs.changesets }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: List pending changesets
        id: plan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
        run: |
          changesets=$(npm run --silent db:status | jq -c '.pendingChangesets')
          echo "changesets=$changesets" >> "$GITHUB_OUTPUT"
          echo "pending=$(jq 'length > 0' <<< "$changesets")" >> "$GITHUB_OUTPUT"
          echo "Pending changesets: $(jq -r 'if length == 0 then "none" else join(", ") end' <<< "$changesets")" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Check configuration
        env:
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          if [ "$HAS_VERCEL_TOKEN" != "true" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::The release environment needs VERCEL_TOKEN. See docs/releasing.md#one-time-setup."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Deploy without the production domain
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes vercel@65.16.0 deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" --meta "releaseTag=$GITHUB_REF_NAME" --meta "releaseSha=$GITHUB_SHA")
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # Only this job receives the production write token, and only after the owner approves the listed changesets.
  migrate:
    needs: [plan, deploy]
    if: needs.plan.outputs.pending == 'true'
    runs-on: ubuntu-latest
    environment: production-migration
    timeout-minutes: 40
    env:
      APPROVED_CHANGESETS: ${{ needs.plan.outputs.changesets }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
    steps:
      - name: Check configuration
        env:
          HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
          HAS_DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN != '' }}
          HAS_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
          HAS_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY != '' }}
          HAS_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT != '' }}
          HAS_BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET != '' }}
          HAS_BACKUP_AGE_RECIPIENTS: ${{ vars.BACKUP_AGE_RECIPIENTS != '' }}
        run: |
          missing=""
          for name in DATABASE_URL DATABASE_AUTH_TOKEN R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT BACKUP_BUCKET BACKUP_AGE_RECIPIENTS; do
            flag="HAS_${name}"
            if [ "${!flag}" != "true" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::The production-migration environment is missing:$missing. See docs/releasing.md#one-time-setup."
            exit 1
          fi
          echo "Approved changesets for $GITHUB_REF_NAME: $APPROVED_CHANGESETS" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Guards against a migration applied by someone else between the plan and the approval.
      - name: Re-check the pending changesets against the approved plan
        run: |
          current=$(npm run --silent db:status | jq -c '.pendingChangesets')
          if [ "$current" != "$APPROVED_CHANGESETS" ]; then
            echo "::error::The pending changesets changed after the plan. Re-run the release to approve the current list."
            exit 1
          fi

      - name: Back up before the migration
        uses: ./.github/actions/database-backup
        with:
          database-url: ${{ secrets.DATABASE_URL }}
          database-auth-token: ${{ secrets.DATABASE_AUTH_TOKEN }}
          ref: ${{ github.sha }}
          reason: pre-migration-${{ github.ref_name }}
          bucket: ${{ vars.BACKUP_BUCKET }}
          endpoint: ${{ secrets.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          age-recipients: ${{ vars.BACKUP_AGE_RECIPIENTS }}

      # The rehearsal copy holds production data; it exists only on this runner and is removed at the end of the job.
      - name: Rehearse the migration on a local copy
        run: |
          rehearsal="$RUNNER_TEMP/rehearsal"
          mkdir -m 700 "$rehearsal"
          npm run --silent db:export -- --file="$rehearsal/copy.sqlite"
          # A lease copied from a running production sync would block the rehearsal; the copy runs no jobs.
          node -e 'const { DatabaseSync } = require("node:sqlite"); new DatabaseSync(process.argv[1]).exec("DELETE FROM leases");' "$rehearsal/copy.sqlite"
          DATABASE_URL="file:$rehearsal/copy.sqlite" DATABASE_AUTH_TOKEN="" npm run --silent db:migrate > /dev/null
          if ! npm run --silent db:verify-backup -- --file="$rehearsal/copy.sqlite" > /dev/null; then
            echo "::error::The migrated rehearsal copy failed verification."
            exit 1
          fi
          echo "Rehearsal: the changesets applied cleanly to a copy of production." >> "$GITHUB_STEP_SUMMARY"

      # A rejected sign-in (401) proves startup, migration-history verification and queries against the authentication tables.
      # Throwaway secrets: the rehearsal never decrypts bank sessions or keeps a session.
      - name: Run the release build against the migrated copy
        env:
          DATABASE_URL: file:${{ runner.temp }}/rehearsal/copy.sqlite
          DATABASE_AUTH_TOKEN: ""
          APP_URL: https://rehearsal.invalid
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build > /dev/null
          BETTER_AUTH_SECRET=$(openssl rand -hex 32) DATA_ENCRYPTION_KEY=$(openssl rand -hex 32) npx next start --hostname 127.0.0.1 --port 3123 > "$RUNNER_TEMP/rehearsal/server.log" 2>&1 &
          for _ in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:3123/ && break; sleep 1; done
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3123/api/auth/sign-in/username -H "Origin: $APP_URL" -H "Content-Type: application/json" --data '{"username":"rehearsal","password":"not-a-real-password"}')
          kill %1
          if [ "$status" != "401" ]; then
            echo "::error::The release build did not answer a database-backed sign-in check on the migrated copy (HTTP $status)."
            exit 1
          fi

      - name: Remove the rehearsal copy
        if: always()
        run: rm -rf "$RUNNER_TEMP/rehearsal"

      # db:migrate holds the sync lease (waiting up to 10 minutes for a running sync or import), so no job writes during the migration.
      # From here until the promotion, cold starts of the previous deployment refuse the newer migration history; keep this window short.
      - name: Migrate production
        run: |
          npm run --silent db:migrate > /dev/null
          echo "Migrated production with $APPROVED_CHANGESETS" >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: [deploy, migrate]
    # Runs after a successful migration, or directly when nothing was pending and the migration job was skipped.
    if: ${{ !cancelled() && needs.deploy.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.migrate.result) }}
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error::The release environment needs PRODUCTION_URL. See docs/releasing.md#one-time-setup."
            exit 1
          fi

      - name: Promote the deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.url }}
        run: npx --yes vercel@65.16.0 promote "$DEPLOYMENT_URL" --yes --token "$VERCEL_TOKEN"

      - name: Smoke test
        run: |
          page=$(curl -s -o /dev/null -w '%{http_code}' "$PRODUCTION_URL/")
          api=$(curl -s -o /dev/null -w '%{http_code}' "$PRODUCTION_URL/api/me")
          echo "Smoke test: / → $page, /api/me → $api (expected 2xx/3xx and 401)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${page:0:1}" != "2" ] && [ "${page:0:1}" != "3" ] || [ "$api" != "401" ]; then
            echo "::error::Smoke test failed. See docs/releasing.md#recovery."
            exit 1
          fi

  recovery-hint:
    needs: [deploy, migrate, promote]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Recovery hint
        run: |
          {
            echo "## Release failed"
            echo "Check which job failed. Before 'Migrate production' nothing changed in production; the previous deployment still serves."
            echo "After a migration, the previous build cannot cold-start: fix forward with a new release, or restore the pre-migration backup or point-in-time copy and roll back to the previous deployment in Vercel (docs/releasing.md#recovery)."
          } >> "$GITHUB_STEP_SUMMARY"
