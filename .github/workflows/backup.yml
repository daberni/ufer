name: Database backup

# Nightly: exports the production database, verifies the copy, encrypts it to the owner's age public key and uploads it to R2 (.github/actions/database-backup, also used before release migrations).
# The repository is public: nothing derived from the data (rows, counts, connection strings) may reach a log, the job summary or an artifact.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or tag whose migrations match the production database (default: the selected branch)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: backup
    timeout-minutes: 20
    env:
      REASON: ${{ github.event_name == 'schedule' && 'nightly' || 'manual' }}
      SOURCE_REF: ${{ inputs.ref || github.sha }}
    steps:
      - name: Check configuration
        id: config
        env:
          HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
          HAS_DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN != '' }}
          HAS_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
          HAS_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY != '' }}
          HAS_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT != '' }}
          HAS_BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET != '' }}
          HAS_BACKUP_AGE_RECIPIENTS: ${{ vars.BACKUP_AGE_RECIPIENTS != '' }}
        run: |
          missing=""
          for name in DATABASE_URL DATABASE_AUTH_TOKEN R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT BACKUP_BUCKET BACKUP_AGE_RECIPIENTS; do
            flag="HAS_${name}"
            if [ "${!flag}" != "true" ]; then
              missing="$missing $name"
            fi
          done
          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          message="Database backup is not configured; missing in the backup environment:$missing. See docs/backup-and-restore.md#one-time-setup."
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "## Database backup skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::$message"

      # All tooling comes from this workflow's commit; only the changesets come from the release matching the database.
      - uses: actions/checkout@v7
        if: steps.config.outputs.configured == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: steps.config.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        run: npm ci --no-audit --no-fund

      - name: Back up
        id: upload
        if: steps.config.outputs.configured == 'true'
        uses: ./.github/actions/database-backup
        with:
          database-url: ${{ secrets.DATABASE_URL }}
          database-auth-token: ${{ secrets.DATABASE_AUTH_TOKEN }}
          ref: ${{ env.SOURCE_REF }}
          reason: ${{ env.REASON }}
          bucket: ${{ vars.BACKUP_BUCKET }}
          endpoint: ${{ secrets.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          age-recipients: ${{ vars.BACKUP_AGE_RECIPIENTS }}

  alert:
    needs: backup
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Open or update the backup alert issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/backup-alert.sh "The nightly database backup failed."
