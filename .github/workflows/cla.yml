name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

jobs:
  cla:
    # The action reads pull-request metadata and comments only; it never checks out or runs contributed code.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    permissions:
      # Re-runs the failed check after a contributor signs.
      actions: write
      # Commits signatures to the cla-signatures branch.
      contents: write
      # Comments on pull requests and locks them after they close.
      pull-requests: write
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/daberni/ufer/blob/main/CLA.md
          branch: cla-signatures
          allowlist: 'daberni,dependabot[bot],renovate[bot],github-actions[bot],claude[bot],chatgpt-codex-connector[bot]'
