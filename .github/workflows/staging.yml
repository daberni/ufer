name: Staging

# Every push to main migrates the shared preview database and deploys a preview build behind the fixed staging alias.
# That database holds synthetic data only, so its migrations run without approval; the summary still lists them.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging
  # A migration must never be cancelled halfway; newer pushes wait instead.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      STAGING_ALIAS: ${{ vars.STAGING_ALIAS }}
    steps:
      - name: Check configuration
        id: config
        env:
          HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
          HAS_DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN != '' }}
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_STAGING_ALIAS: ${{ vars.STAGING_ALIAS != '' }}
        run: |
          missing=""
          for name in DATABASE_URL DATABASE_AUTH_TOKEN VERCEL_TOKEN STAGING_ALIAS; do
            flag="HAS_${name}"
            if [ "${!flag}" != "true" ]; then
              missing="$missing $name"
            fi
          done
          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          message="Staging is not configured; missing in the staging environment:$missing. See docs/releasing.md#one-time-setup."
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::$message"

      # Concurrency does not guarantee order: a run whose commit is no longer the head of main skips instead of touching staging.
      - name: Check that this commit is still the head of main
        id: head
        if: steps.config.outputs.configured == 'true'
        run: |
          current=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f 1)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=false" >> "$GITHUB_OUTPUT"
          echo "::notice::main moved on to $current; that run updates staging."
          echo "Skipped: this commit is no longer the head of main." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        if: steps.config.outputs.configured == 'true' && steps.head.outputs.current == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: steps.config.outputs.configured == 'true' && steps.head.outputs.current == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.config.outputs.configured == 'true' && steps.head.outputs.current == 'true'
        run: npm ci --no-audit --no-fund

      - name: List pending changesets
        id: plan
        if: steps.config.outputs.configured == 'true' && steps.head.outputs.current == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
        run: .github/scripts/migration-plan.sh "Preview database changesets"

      # Deployed before the migration, so a failed build leaves the alias on a build that matches the database.
      # The build uses Vercel's Preview environment (preview database, sandbox bank); APP_URL makes the alias its trusted origin.
      - name: Deploy the preview build
        id: deploy
        if: steps.config.outputs.configured == 'true' && steps.head.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes vercel@65.16.0 deploy --yes --token "$VERCEL_TOKEN" --meta "stagingSha=$GITHUB_SHA" --env "APP_URL=https://$STAGING_ALIAS")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Migrate the preview database
        if: steps.config.outputs.configured == 'true' && steps.head.outputs.current == 'true' && steps.plan.outputs.pending == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
        run: npm run --silent db:migrate > /dev/null

      # Re-checked here: main may have moved on while this run was building or migrating.
      - name: Point the staging alias at it
        if: steps.config.outputs.configured == 'true' && steps.head.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          current=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f 1)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved on to $current; leaving the staging alias to that run."
            echo "Staging alias unchanged: this commit is no longer the head of main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes vercel@65.16.0 alias set "$DEPLOYMENT_URL" "$STAGING_ALIAS" --token "$VERCEL_TOKEN"
          echo "Staging: https://$STAGING_ALIAS ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
