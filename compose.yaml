services:
  app:
    build: .
    image: ufer:local
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: file:/app/data/budget.db
      ENABLE_BANKING_PRIVATE_KEY_PATH: /run/secrets/enable_banking_key
    volumes:
      - budget-data:/app/data
    secrets:
      - enable_banking_key
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  scheduler:
    image: node:22-bookworm-slim
    profiles: [sync]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET}
      SYNC_URL: http://app:3000/api/cron
      SYNC_HOUR: ${SYNC_HOUR:-6}
    volumes:
      - ./scripts/scheduler.mjs:/app/scheduler.mjs:ro
    command: [node, /app/scheduler.mjs]
    user: node
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  enable_banking_key:
    file: ${ENABLE_BANKING_PRIVATE_KEY_HOST_PATH:?Set the PEM file path}

volumes:
  budget-data:
